name: Release candidate validation

# Publication is intentionally disabled until #3, #32 and #33 are resolved.
# Do not restore a mutable upstream workflow or add write permissions here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact proposed manifest version and changelog heading
        required: true
        type: string
      previous_version:
        description: Previous release version (or inherited version for the first release)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Read-only release candidate check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Validate candidate without creating tags, PRs or releases
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          python scripts/check_integration.py --release-tag "$CANDIDATE_VERSION" --previous-version "$PREVIOUS_VERSION"
          python -m unittest discover -s scripts -p 'test_*.py'
